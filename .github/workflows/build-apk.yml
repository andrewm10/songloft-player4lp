name: Build Songloft APK (Leapmotor 方控)

# 在 fork 里 push 到 main/master/build-apk，或在 Actions 页手动 Run workflow 即自动出包。
# runner 钉死 ubuntu-24.04，避免 ubuntu-latest 于 2026-10-19 起迁移到 Ubuntu 26 导致工具链突变。
#
# 重要：本工作流会自动在仓库内定位 pubspec.yaml（Flutter 工程根），无论从仓库哪一层都能找到。
# 如果你 fork 的是父仓库 songloft-org/songloft（monorepo，clients/player 是未初始化的 git submodule），
# 则仓库内没有 pubspec.yaml，本流程会直接报错并提示你改用 songloft-org/songloft-player。
on:
  push:
    branches: [ main, master, build-apk ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (含 patch/ 与 .github/)
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms, build-tools, NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          # compileSdk = flutter.compileSdkVersion（3.41 -> 35/36），两个都装保险
          sdkmanager --install "platforms;android-35" "platforms;android-36" \
                                 "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"
          # NDK 用 Flutter 3.41 默认版本
          sdkmanager --install "ndk;27.0.12077973"
          yes | sdkmanager --licenses

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          flutter doctor -v

      - name: Locate Flutter project root
        id: locate
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          PROJ=$(find . -path ./.git -prune -o -name pubspec.yaml -print | head -1)
          if [ -z "$PROJ" ]; then
            echo "::error::仓库内找不到 pubspec.yaml。"
            echo "::error::请确认你 Fork 的是 Flutter 客户端仓库 songloft-org/songloft-player（而不是父仓库 songloft-org/songloft）。"
            echo "::error::父仓库是 monorepo，clients/player 是未初始化的 git submodule，fork 后里面没有源码、也没有 pubspec.yaml。"
            exit 1
          fi
          PROJ_DIR=$(realpath "$(dirname "$PROJ")")
          if [ ! -d "$PROJ_DIR/android" ]; then
            echo "::error::在 $PROJ_DIR 找到 pubspec.yaml，但旁边没有 android/ 目录，不是标准 Flutter 工程。"
            exit 1
          fi
          echo "Flutter 工程根目录: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply Leapmotor 方控 patch
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          DST="android/app/src/main/kotlin/com/songloft/songloft_flutter"
          mkdir -p "$DST"
          cp "$GITHUB_WORKSPACE/patch/LeapmotorMediaKeys.kt" "$DST/"
          cp "$GITHUB_WORKSPACE/patch/SongloftApplication.kt" "$DST/"
          echo "Applied patch files:"
          ls -l "$DST"

      - name: Flutter pub get
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter pub get

      - name: Build release APK (arm64)
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: songloft-leapmotor-apk
          path: ${{ steps.locate.outputs.proj_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
