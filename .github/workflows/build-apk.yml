name: Build Songloft APK (Leapmotor 方控)

# 在 fork 里 push 到 main，或在 Actions 页手动 Run workflow 即自动出包并发布到 Releases。
# runner 对齐官方用 ubuntu-latest（当前即 Ubuntu 24.04）。
#
# 重要：请确认你 Fork 的是 Flutter 客户端仓库 songloft-org/songloft-player（根目录有 pubspec.yaml）。
# 若 fork 的是父仓库 songloft-org/songloft（monorepo，clients/player 是未初始化的 git submodule），
# 仓库内没有 pubspec.yaml，本流程会直接报错并提示改用 songloft-player。
#
# 本工作流对齐官方 .github/workflows/build-and-release.yml 的 build-android job（Flutter 3.44.6、
# 不做 Go 后端），并参照其 release 段用 gh CLI 发布。除三处面向方控的改造外，已逐项对齐官方构建细节：
# 方控改造：
#   ① 拷贝方控补丁（Leapmotor24Wheel.kt / LeapmotorInitProvider.kt）并通过 ContentProvider 自动初始化，
#      不再覆盖上游 SongloftApplication，从设计上免疫上游 Application 类改动；
#   ② 构建「按 CPU 架构拆分」的 APK（flutter build apk --release --split-per-abi），
#      只保留两个包：arm64-v8a（车机，ARM SoC）与 x86_64（PC 模拟器 x86_64 调试用），
#      剔除 armeabi-v7a 32 位 ARM 包。
#      注意：x86_64 的 PC 模拟器（雷电/LDPlayer）必须装 x86_64 包——装 arm64 包会走 ARM 二进制
#      翻译（houdini），Flutter 引擎在翻译层下极易崩溃/卡启动，测出的现象不代表 App 本身。
#   ③ 版本号跟随上游源码（pubspec.yaml version 字段），每次构建滚动覆盖同名 Release。
# 与官方对齐的构建细节（保证 App 运行正常）：
#   - runner: ubuntu-latest（与官方一致）
#   - setup-android（导出 ANDROID_HOME）+ flutter config --android-sdk（构建本身需要 Android SDK）
#   - Setup Android signing：解码 ANDROID_KEYSTORE_BASE64 为 release.jks，供 Gradle 签名
#   - Compute native contract hash：必执行并把 native_contract.json 写进 assets（App 启动读取，缺失会卡死）
#   - version.json：设置页「检查客户端更新」dev 渠道精确比较用
on:
  push:
    branches: [ main, master, build-apk ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release（gh release create 需要写权限）

env:
  # 与原版 build-and-release.yml 保持一致，使用官方验证过的稳定版本。
  FLUTTER_VERSION: '3.44.6'

jobs:
  build-and-release:
    name: Build & Release APK (Leapmotor 方控)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 多插件（media_kit / inappwebview / window_manager / home_widget 等）release 打包有 OOM 风险，
      # 显式提到 4G 兜底（与官方默认行为不冲突）。若仍 OOM 可调到 -Xmx6g。
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # 关闭缓存：曾因 cache 复用陈旧的 shared_preferences_android AAR，导致 Dart 侧 Pigeon
          # 调 getAll(Continuation) 而 Native AAR 仍是旧签名，启动抛 NoSuchMethodError 卡死在加载页。
          # 关掉后每次全新解析+下载，杜绝这种插件 Dart/Native 版本错配。
          cache: false

      - name: Set up Android SDK
        # 官方 build-android 用 setup-android 准备 Android SDK 并导出 ANDROID_HOME，
        # 供后续 flutter config --android-sdk 使用（构建本身需要 Android SDK）。
        # 用 v4.0.4（适配 Node 24 runner，避免 v3 被强制跑在 Node 24 上导致该步失败、后续全部不执行）。
        uses: android-actions/setup-android@v4.0.4

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          if [ -n "$ANDROID_HOME" ]; then
            flutter config --android-sdk "$ANDROID_HOME"
          fi

      - name: Verify Flutter project root
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            echo "::error::仓库根目录未找到 pubspec.yaml。"
            echo "::error::请确认你 Fork 的是 Flutter 客户端仓库 songloft-org/songloft-player（而不是父仓库 songloft-org/songloft）。"
            echo "::error::父仓库是 monorepo，clients/player 是未初始化的 git submodule，fork 后里面没有源码、也没有 pubspec.yaml。"
            exit 1
          fi

      - name: Apply Leapmotor 2024+ 方控 patch (拷贝新增 Kotlin 文件，不改上游 Application)
        run: |
          DST="android/app/src/main/kotlin/com/songloft/songloft_flutter"
          mkdir -p "$DST"
          cp "$GITHUB_WORKSPACE/patch/Leapmotor24Wheel.kt" "$DST/"
          cp "$GITHUB_WORKSPACE/patch/LeapmotorInitProvider.kt" "$DST/"
          cp "$GITHUB_WORKSPACE/patch/Leapmotor24ConfigReceiver.kt" "$DST/"
          echo "Applied patch files:"
          ls -l "$DST"

      - name: Inject Leapmotor provider & config receiver into AndroidManifest (幂等)
        run: python3 "$GITHUB_WORKSPACE/patch/inject_provider.py"

      - name: Flutter clean (清除陈旧插件构建产物)
        # 彻底清掉 build/.dart_tool 等，避免仓库内残留的旧 shared_preferences 产物参与本次构建。
        run: flutter clean

      # 删掉（可能随仓库提交的）pubspec.lock 再 pub get。
      # 原因：实测仅靠 cache:false + flutter clean **没能**消除
      #   NoSuchMethodError: SharedPreferencesApiRegistrar.getAll(...Continuation)
      # 若仓库提交了 pubspec.lock，pub get 会沿用锁定的旧版本组合，可能把
      # shared_preferences(Dart 侧，新 Pigeon API) 与 shared_preferences_android(原生 AAR，旧 API)
      # 锁成互不匹配的组合。删 lock 可强制重新解析出一套自洽的版本
      # （pubspec.yaml 里已有的 dependency_overrides 仍然生效，不会被跳过）。
      - name: Drop pubspec.lock (强制重新解析依赖版本，修复 Dart/原生版本错配)
        run: |
          if [ -f pubspec.lock ]; then
            rm -f pubspec.lock
            echo "已删除仓库内的 pubspec.lock，强制重新解析依赖版本"
          else
            echo "仓库内无 pubspec.lock，直接解析"
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Print resolved plugin versions (shared_preferences 版本诊断)
        run: |
          echo "=== shared_preferences 系列实际解析版本（诊断 Dart/原生是否错配）==="
          grep -A8 -E '^  shared_preferences(_android)?:$' pubspec.lock \
            | grep -E 'name:|version:' || echo "(pubspec.lock 中未找到 shared_preferences 条目，请人工确认依赖)"

      # 版本号跟随上游源码：直接取 pubspec.yaml 的 version 字段（去掉 +build 号）。
      # 例如上游 version: 2.13.3+1 → Release tag = 2.13.3。
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      # 对齐官方 build-android：把仓库 Secret ANDROID_KEYSTORE_BASE64 解码为 jks，
      # 并通过 GITHUB_ENV 导出 ANDROID_KEYSTORE_PATH，供后续 build 步骤的 Gradle 签名使用。
      # 若未配置该 Secret 则跳过（build 会回退到默认 debug 签名，APK 仍可正常安装）。
      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已解码签名 keystore -> $RUNNER_TEMP/release.jks"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，跳过自定义签名（使用默认 debug 签名）"
          fi

      # 原生契约哈希：官方在 pub get 之后、build 之前执行，并把结果写进资产
      # android/app/src/main/assets/native_contract.json。该资产在 App 启动初始化时会被读取，
      # 缺失会导致「正在启动中」卡死（这正是早先「能装但进不去」的最可能原因之一）。
      # 故此处改为【必执行、始终保证资产存在】：脚本成功就用官方同款结果；脚本缺失或执行失败
      # （如 runner 缺 Go 等依赖）则回退生成占位资产并告警，绝不再用 continue-on-error/||true 静默吞掉。
      - name: Compute native contract hash (bake asset)
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          if [ -f scripts/compute_native_contract.sh ]; then
            if HASHES=$(./scripts/compute_native_contract.sh \
                 --write-asset android/app/src/main/assets/native_contract.json); then
              echo "native_contract.json 已生成（官方同款脚本）"
              echo "native_contract hash = $HASHES"
              DART_CONTRACT_HASH=$(printf '%s' "$HASHES" | sed -n 's/.*"dart":"\([a-f0-9]*\)".*/\1/p')
              echo "DART_CONTRACT_HASH=$DART_CONTRACT_HASH" >> "$GITHUB_ENV"
            else
              echo "::warning:: compute_native_contract.sh 执行失败（可能缺 Go 等依赖），回退生成占位资产"
              printf '{\n  "dart": "",\n  "go": ""\n}\n' > android/app/src/main/assets/native_contract.json
            fi
          else
            echo "::warning:: 未找到 scripts/compute_native_contract.sh，生成占位 native_contract.json 避免缺资产卡死"
            printf '{\n  "dart": "",\n  "go": ""\n}\n' > android/app/src/main/assets/native_contract.json
          fi
          echo "=== native_contract.json 内容 ==="
          cat android/app/src/main/assets/native_contract.json

      # 构建「按 CPU 架构拆分」的 APK：用 --split-per-abi 一次性产出各架构包，然后只留两个：
      #   - arm64-v8a：车机（ARM SoC）正式包
      #   - x86_64   ：PC 模拟器（雷电/LDPlayer 等 x86_64）调试包，原生运行、不经 ARM 翻译
      # 剔除 armeabi-v7a（32 位 ARM，不需要）。
      # 包体积更小、下载更快，避免通用包（多架构合并）臃肿。
      - name: "Build release APK (arm64-v8a + x86_64)"
        id: build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p apk-output
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "git_commit=$GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "GIT_COMMIT=$GIT_COMMIT" >> "$GITHUB_ENV"
          flutter build apk --release --split-per-abi \
            --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} \
            --dart-define=FRONTEND_GIT_COMMIT=$GIT_COMMIT \
            --dart-define=FLUTTER_BINDING=${{ env.FLUTTER_VERSION }} \
            --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} \
            --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} \
            --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }} \
            2>&1 | tee "$RUNNER_TEMP/songloft-build.log"

          SRC=build/app/outputs/flutter-apk
          # arm64-v8a：车机（ARM SoC）正式包
          mv "$SRC/app-arm64-v8a-release.apk" apk-output/songloft-leapmotor-arm64-v8a.apk
          # x86_64：PC 模拟器（雷电/LDPlayer 等 x86_64）调试包，原生运行不经 ARM 翻译
          mv "$SRC/app-x86_64-release.apk" apk-output/songloft-leapmotor-x86_64.apk
          # armeabi-v7a：32 位 ARM，不需要
          rm -f "$SRC/app-armeabi-v7a-release.apk"
          echo "=== APK 产物（arm64-v8a 车机 / x86_64 模拟器调试）==="
          ls -lh apk-output/

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/songloft-build.log
          if-no-files-found: ignore

      - name: Summarize first errors (on failure)
        if: failure()
        run: |
          echo "===== 构建日志中首个错误附近内容 ====="
          grep -n -i -E "error:|what went wrong|exception|failed for task|outofmemory|gc overhead|could not|unresolved|conflicting" "$RUNNER_TEMP/songloft-build.log" | head -40 || echo "(no grep matches)"

      - name: Upload APK artifact (backup)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: songloft-leapmotor-apk
          path: |
            apk-output/*.apk
            apk-output/version.json
          retention-days: 30

      # version.json：对齐官方 build-android。设置页「检查客户端更新」的 dev 渠道靠它拿 git_commit /
      # build_time 做精确比较(frontend_version_api._fetchDevVersionInfo)，缺失会导致 dev 客户端
      # 永远显示「已是最新」。此处一并产出，避免该副作用（非启动卡死原因，但属标准产物）。
      - name: Generate version.json
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
          GIT_COMMIT: ${{ steps.build.outputs.git_commit }}
        run: |
          mkdir -p apk-output
          printf '{\n  "version": "%s",\n  "git_commit": "%s",\n  "build_time": "%s"\n}\n' \
            "$VERSION" "$GIT_COMMIT" "$BUILD_TIME" > apk-output/version.json
          echo "=== version.json 内容 ==="
          cat apk-output/version.json

      # 发布到 GitHub Releases（参照原版 build-and-release.yml 的 gh CLI 方案）。
      # 版本号跟随上游源码（TAG = pubspec version）；每次构建删除旧的同名 Release+tag 再重建，实现滚动。
      - name: Delete existing release (rolling same-version)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release (gh CLI)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
          NOTES: |
            Songloft Player (Flutter) + 零跑 2024+ 车机方控 (Leapmotor steering wheel controls, 2024–2027)

            版本: ${{ steps.version.outputs.version }}
            提交: ${{ steps.build.outputs.git_commit }}
            构建时间(UTC): ${{ steps.version.outputs.build_time }}
            Flutter: ${{ env.FLUTTER_VERSION }}

            ## 功能
            - 零跑方向盘媒体键（上一首 / 下一首 / 播放暂停）监听，转发给 audio_service 媒体会话
            - 协议：广播 com.leapmotor.steerwheelcontrol.media，int extra "action"（1/4/7）
            - 适用零跑 2024–2027 款（C10 及以后）

            ## 下载（按你的环境二选一）
            - **车机**（零跑 C10 / C11 / C16 等，ARM SoC）→ **songloft-leapmotor-arm64-v8a.apk**
            - **PC 模拟器**（雷电 / LDPlayer 等 **x86_64**）→ **songloft-leapmotor-x86_64.apk**
              ⚠️ 模拟器请务必装 x86_64 包。x86_64 模拟器装 arm64 包会走 ARM 二进制翻译（houdini），
              Flutter 引擎在翻译层下极易崩溃 / 卡在启动页，**测出来的现象不能代表 App 本身**。
            - 极少数老 32 位 ARM 车机（armeabi-v7a）本 Release 不提供，需单独构建。

            ## 安装
            设备开启「开发者选项 → USB 调试」后执行：
            车机（arm64）：
                adb install -r songloft-leapmotor-arm64-v8a.apk
            模拟器（x86_64）：
                adb install -r songloft-leapmotor-x86_64.apk

            ## 验证方控
                adb logcat -s Songloft-Leapmotor
            按方控「下一首」应看到：方控转发 action=4 -> keyCode=87

            本 Release 由 fork 的 GitHub Actions 自动构建并滚动更新，版本号跟随上游 songloft-player 源码。
        run: |
          set -euo pipefail
          ARGS=(
            "${TAG}"
            --title "Songloft 零跑方控 ${TAG}"
            --notes "${NOTES}"
            --latest
          )
          # 非 tag 触发时，将 Release 指向当前 commit（参照原版 release job 行为）
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            ARGS+=(--target "$GITHUB_SHA")
          fi
          gh release create "${ARGS[@]}" apk-output/*
          echo "::notice::已发布到 Release: $TAG -> https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
