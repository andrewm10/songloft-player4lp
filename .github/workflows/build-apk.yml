name: Build Songloft APK (Leapmotor 方控)

# 在 fork 里 push 到 main，或在 Actions 页手动 Run workflow 即自动出包并发布到 Releases。
# runner 对齐官方用 ubuntu-latest（当前即 Ubuntu 24.04）。
#
# 重要：请确认你 Fork 的是 Flutter 客户端仓库 songloft-org/songloft-player（根目录有 pubspec.yaml）。
# 若 fork 的是父仓库 songloft-org/songloft（monorepo，clients/player 是未初始化的 git submodule），
# 仓库内没有 pubspec.yaml，本流程会直接报错并提示改用 songloft-player。
#
# 本工作流对齐官方 .github/workflows/build-and-release.yml 的 build-android job（Flutter 3.44.6、
# 不做 Go 后端），并参照其 release 段用 gh CLI 发布。除三处面向方控的改造外，已逐项对齐官方构建细节：
# 方控改造（严格按《方向盘方控方案》第 6 部分「移植到别的 App 的完整步骤」实现）：
#   ① 三层齐全：收按键（动态注册 + 400ms 去重 + 会话未就绪补发）/ 占媒体源
#      （com.leapmotor.transfer.MEDIA.INFO + 1s 心跳 + 按键后重推 + 前台门）/ 送达
#      （文档第 4 步：把「发 HID 报文」换成「调自己的播放器」，这里转发标准媒体键给 audio_service）。
#      进程级注册通过 ContentProvider 完成（等价于文档第 1 步的 Application.onCreate 注册，
#      但不改上游 SongloftApplication，免疫上游 Application 类改动）。
#   ② 构建「按 CPU 架构拆分」的 APK（flutter build apk --release --split-per-abi），
#      只保留两个包：arm64-v8a（车机，ARM SoC）与 x86_64（PC 模拟器 x86_64 调试用），
#      剔除 armeabi-v7a 32 位 ARM 包。
#      注意：x86_64 的 PC 模拟器（雷电/LDPlayer）必须装 x86_64 包——装 arm64 包会走 ARM 二进制
#      翻译（houdini），Flutter 引擎在翻译层下极易崩溃/卡启动，测出的现象不代表 App 本身。
#   ③ 版本号跟随上游源码（pubspec.yaml version 字段），每次构建滚动覆盖同名 Release。
# 与官方对齐的构建细节（保证 App 运行正常）：
#   - runner: ubuntu-latest（与官方一致）
#   - setup-android（导出 ANDROID_HOME）+ flutter config --android-sdk（构建本身需要 Android SDK）
#   - Setup Android signing：解码 ANDROID_KEYSTORE_BASE64 为 release.jks，供 Gradle 签名
#   - Compute native contract hash：必执行并把 native_contract.json 写进 assets（App 启动读取，缺失会卡死）
#   - version.json：设置页「检查客户端更新」dev 渠道精确比较用
on:
  push:
    branches: [ main, master, build-apk ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

  # 供 sync-upstream.yml 在推送完成后调用。
  # 为什么需要它：sync-upstream 用 GITHUB_TOKEN 推送，而 GitHub 明确规定「由 GITHUB_TOKEN 产生的
  # push 事件不会触发其他工作流」（防止递归运行），所以 on: push 收不到同步产生的推送。
  # 官方文档同时指出 workflow_dispatch 与 repository_dispatch 是两个例外——
  # 即使用 GITHUB_TOKEN 创建，也始终会触发工作流运行。故同步成功后由脚本显式派发本事件。
  repository_dispatch:
    types: [sync-from-upstream]

permissions:
  contents: write   # 发布 Release（gh release create 需要写权限）

env:
  # 与原版 build-and-release.yml 保持一致，使用官方验证过的稳定版本。
  FLUTTER_VERSION: '3.44.6'

jobs:
  build-and-release:
    name: Build & Release APK (Leapmotor 方控)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 多插件（media_kit / inappwebview / window_manager / home_widget 等）release 打包有 OOM 风险，
      # 显式提到 4G 兜底（与官方默认行为不冲突）。若仍 OOM 可调到 -Xmx6g。
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # 关闭缓存：避免跨构建复用陈旧产物，保证每次都是全新解析。
          # （注意：真正的卡启动根因是 shared_preferences_android 2.5.0 的 Pigeon JNI 改动，
          #   已由下方「Pin shared_preferences_android to 2.4.28」步骤解决；
          #   关缓存只是顺带的卫生习惯，别指望它单独解决问题。）
          cache: false

      - name: Set up Android SDK
        # 官方 build-android 用 setup-android 准备 Android SDK 并导出 ANDROID_HOME，
        # 供后续 flutter config --android-sdk 使用（构建本身需要 Android SDK）。
        # 用 v4.0.4（适配 Node 24 runner，避免 v3 被强制跑在 Node 24 上导致该步失败、后续全部不执行）。
        uses: android-actions/setup-android@v4.0.4

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          if [ -n "$ANDROID_HOME" ]; then
            flutter config --android-sdk "$ANDROID_HOME"
          fi

      - name: Verify Flutter project root
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            echo "::error::仓库根目录未找到 pubspec.yaml。"
            echo "::error::请确认你 Fork 的是 Flutter 客户端仓库 songloft-org/songloft-player（而不是父仓库 songloft-org/songloft）。"
            echo "::error::父仓库是 monorepo，clients/player 是未初始化的 git submodule，fork 后里面没有源码、也没有 pubspec.yaml。"
            exit 1
          fi

      # 按《方向盘方控方案》第 6 部分「移植到别的 App 的完整步骤」落地：
      #   第 1 步 进程级注册          -> LeapmotorInitProvider（CP 自动初始化，等价 Application.onCreate）
      #   第 2 步 三个文件            -> Leapmotor24Wheel（方控接收器）/ LeapmotorMediaClaim（媒体源声明）
      #                                  / Leapmotor24SteeringReceiver（静态接收器）；另加 ADB 配置入口
      #   第 3 步 manifest 静态接收器 -> 由 inject_provider.py 注入
      #   第 4 步 送达改为调自己的播放器 -> 转发标准 ACTION_MEDIA_BUTTON 给 audio_service
      #   第 5 步 媒体源填真实曲目     -> 读本 App 媒体通知的标题/歌手
      - name: Apply Leapmotor 2024+ 方控 patch (拷贝新增 Kotlin 文件，不改上游 Application)
        run: |
          set -euo pipefail
          DST="android/app/src/main/kotlin/com/songloft/songloft_flutter"
          mkdir -p "$DST"
          PATCH_FILES=(
            "Leapmotor24Wheel.kt"
            "LeapmotorMediaClaim.kt"
            "Leapmotor24SteeringReceiver.kt"
            "Leapmotor24ConfigReceiver.kt"
            "LeapmotorInitProvider.kt"
          )
          for f in "${PATCH_FILES[@]}"; do
            if [ ! -f "$GITHUB_WORKSPACE/patch/$f" ]; then
              echo "::error::缺少补丁文件 patch/$f，方控功能将不完整，终止构建。"
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/patch/$f" "$DST/"
          done
          echo "Applied patch files:"
          ls -l "$DST"

      - name: Inject Leapmotor provider, static receiver & config receiver into AndroidManifest (幂等)
        run: python3 "$GITHUB_WORKSPACE/patch/inject_provider.py"

      # 插件界面字号补偿（高分屏车机）：插件是 WebView 里的 HTML/CSS，字号写死在插件
      # 自己的 CSS 里；Flutter「设置 → 字体大小」（TextScaler）对它完全无效，上游又关了
      # supportZoom，于是 2560×1440 这类屏上插件字很小、还无法手动放大。
      # 这里在构建时给 initialSettings 注入 textZoom（默认 130%）并放开双指缩放，
      # 走文本注入而非改上游源码 → 每次同步上游都不会冲突。
      # 临时改倍率不用改代码：仓库 Settings → Variables 里加 PLUGIN_TEXT_ZOOM 即可。
      - name: "Patch plugin WebView text zoom (high-DPI screens)"
        env:
          PLUGIN_TEXT_ZOOM: "${{ vars.PLUGIN_TEXT_ZOOM || '130' }}"
        run: python3 "$GITHUB_WORKSPACE/patch/patch_webview_zoom.py"

      - name: Flutter clean (清除陈旧构建产物)
        # 清掉 build/ 与 .dart_tool，避免上一次构建的陈旧产物混入本次 APK。
        # 注意：flutter clean **不会**清 pub-cache，也**不会**改 pubspec.lock，
        # 单靠它无法规避 shared_preferences_android 2.5.0 的问题（版本钉住才管用）。
        run: flutter clean

      # 关键修复：把 shared_preferences_android 钉回 2.4.28（传统 Pigeon 通道实现）。
      # 该包 2.5.0（2026-10-17 发布）把内部实现换成了 Pigeon JNI（jnigen 直接 JNI 调用），
      # Dart 侧会去调原生 SharedPreferencesApiRegistrar.getAll(String, List, Continuation)；
      # 一旦该签名不可用就抛
      #   java.lang.NoSuchMethodError: ... SharedPreferencesApiRegistrar.getAll(...Continuation)
      # 导致偏好读写全部失效 → 读不到 token / 服务器配置 → 卡在「正在启动中」（卡住，不崩溃）。
      # 而 shared_preferences 2.5.6 对它的约束是 ^2.3.4，pub 默认解析到最新的 2.5.0，自动踩坑。
      # 2.4.28 在 ^2.3.4 之内且仍是自洽的传统 Pigeon 通道实现。
      #
      # 注意：**不要**删 pubspec.lock「强制重新解析」——那样只会让 pub 解析到最新（含坏的 2.5.0）。
      # 正确做法是用 dependency_overrides 显式钉版本，它优先级最高且一定能盖住上游的既有 override。
      - name: Pin shared_preferences_android to 2.4.28 (绕开 2.5.0 的 Pigeon JNI 崩溃)
        run: python3 "$GITHUB_WORKSPACE/patch/pin_shared_prefs.py"

      - name: Flutter pub get
        run: flutter pub get

      - name: Print resolved plugin versions (shared_preferences 版本诊断)
        run: |
          echo "=== shared_preferences 系列实际解析版本（应为 2.4.28，不要是 2.5.0）==="
          grep -A8 -E '^  shared_preferences(_android)?:$' pubspec.lock \
            | grep -E 'name:|version:' || echo "(pubspec.lock 中未找到 shared_preferences 条目，请人工确认依赖)"
          echo "=== 若上面出现 2.5.0，说明钉版本未生效，请检查 patch/pin_shared_prefs.py 是否被上游改动影响 ==="
          echo "=== 是否开启 R8 代码压缩（minifyEnabled=true 会剥离 JNI 才用的 Kotlin 方法）==="
          grep -rn "minifyEnabled" android/app/build.gradle android/app/build.gradle.kts 2>/dev/null \
            || echo "(未找到 build.gradle / build.gradle.kts 中的 minifyEnabled 配置)"

      # 版本号跟随上游源码：直接取 pubspec.yaml 的 version 字段（去掉 +build 号）。
      # 例如上游 version: 2.13.3+1 → Release tag = 2.13.3。
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      # 对齐官方 build-android：把仓库 Secret ANDROID_KEYSTORE_BASE64 解码为 jks，
      # 并通过 GITHUB_ENV 导出 ANDROID_KEYSTORE_PATH，供后续 build 步骤的 Gradle 签名使用。
      # 若未配置该 Secret 则跳过（build 会回退到默认 debug 签名，APK 仍可正常安装）。
      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # 四个 Secret 必须成组配置。只给 BASE64 时 Gradle 会拿到空 alias/password，
            # 直到 signingConfig 阶段才炸，日志离根因很远，所以在这里提前失败。
            MISSING=""
            [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
            [ -n "$ANDROID_KEY_ALIAS" ] || MISSING="$MISSING ANDROID_KEY_ALIAS"
            [ -n "$ANDROID_KEY_PASSWORD" ] || MISSING="$MISSING ANDROID_KEY_PASSWORD"
            if [ -n "$MISSING" ]; then
              echo "::error::已配置 ANDROID_KEYSTORE_BASE64，但缺少:$MISSING —— 四个 Secret 必须成组配置"
              exit 1
            fi
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已解码签名 keystore -> $RUNNER_TEMP/release.jks"
            echo "=== 本次使用的签名证书（每次构建都应完全一致）==="
            # 强制 keytool 英文输出 + grep -a：避免非 UTF-8 locale 下 grep 判定为二进制、
            # 只打印 "Binary file matches" 而看不到真正的指纹。
            keytool -J-Duser.language=en -J-Duser.country=US -list -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
              | grep -aE "Alias name|SHA256" || echo "(指纹读取失败，请检查 ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 —— 走默认 debug 签名，密钥由 runner 现场随机生成，产出的 APK 无法覆盖安装（必须先卸载）。"
          fi

      # 原生契约哈希：官方在 pub get 之后、build 之前执行，并把结果写进资产
      # android/app/src/main/assets/native_contract.json。该资产在 App 启动初始化时会被读取，
      # 缺失会导致「正在启动中」卡死（这正是早先「能装但进不去」的最可能原因之一）。
      # 故此处改为【必执行、始终保证资产存在】：脚本成功就用官方同款结果；脚本缺失或执行失败
      # （如 runner 缺 Go 等依赖）则回退生成占位资产并告警，绝不再用 continue-on-error/||true 静默吞掉。
      - name: Compute native contract hash (bake asset)
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          if [ -f scripts/compute_native_contract.sh ]; then
            if HASHES=$(./scripts/compute_native_contract.sh \
                 --write-asset android/app/src/main/assets/native_contract.json); then
              echo "native_contract.json 已生成（官方同款脚本）"
              echo "native_contract hash = $HASHES"
              DART_CONTRACT_HASH=$(printf '%s' "$HASHES" | sed -n 's/.*"dart":"\([a-f0-9]*\)".*/\1/p')
              echo "DART_CONTRACT_HASH=$DART_CONTRACT_HASH" >> "$GITHUB_ENV"
            else
              echo "::warning:: compute_native_contract.sh 执行失败（可能缺 Go 等依赖），回退生成占位资产"
              printf '{\n  "dart": "",\n  "go": ""\n}\n' > android/app/src/main/assets/native_contract.json
            fi
          else
            echo "::warning:: 未找到 scripts/compute_native_contract.sh，生成占位 native_contract.json 避免缺资产卡死"
            printf '{\n  "dart": "",\n  "go": ""\n}\n' > android/app/src/main/assets/native_contract.json
          fi
          echo "=== native_contract.json 内容 ==="
          cat android/app/src/main/assets/native_contract.json

      # 构建「按 CPU 架构拆分」的 APK：用 --split-per-abi 一次性产出各架构包，然后只留两个：
      #   - arm64-v8a：车机（ARM SoC）正式包
      #   - x86_64   ：PC 模拟器（雷电/LDPlayer 等 x86_64）调试包，原生运行、不经 ARM 翻译
      # 剔除 armeabi-v7a（32 位 ARM，不需要）。
      # 包体积更小、下载更快，避免通用包（多架构合并）臃肿。
      - name: "Build release APK (arm64-v8a + x86_64)"
        id: build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p apk-output
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "git_commit=$GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "GIT_COMMIT=$GIT_COMMIT" >> "$GITHUB_ENV"
          flutter build apk --release --split-per-abi \
            --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} \
            --dart-define=FRONTEND_GIT_COMMIT=$GIT_COMMIT \
            --dart-define=FLUTTER_BINDING=${{ env.FLUTTER_VERSION }} \
            --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} \
            --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} \
            --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }} \
            2>&1 | tee "$RUNNER_TEMP/songloft-build.log"

          SRC=build/app/outputs/flutter-apk
          # arm64-v8a：车机（ARM SoC）正式包
          mv "$SRC/app-arm64-v8a-release.apk" apk-output/songloft-leapmotor-arm64-v8a.apk
          # x86_64：PC 模拟器（雷电/LDPlayer 等 x86_64）调试包，原生运行不经 ARM 翻译
          mv "$SRC/app-x86_64-release.apk" apk-output/songloft-leapmotor-x86_64.apk
          # armeabi-v7a：32 位 ARM，不需要
          rm -f "$SRC/app-armeabi-v7a-release.apk"
          echo "=== APK 产物（arm64-v8a 车机 / x86_64 模拟器调试）==="
          ls -lh apk-output/

      # 覆盖安装（adb install -r）要求「包名 + 签名 + versionCode 不降」三项同时成立。
      # 这里把最终产物的证书指纹打进日志和 Job Summary，作为下次能否直接覆盖安装的凭据；
      # 指纹与上次构建不一致，说明 keystore 被换过，必须先卸载。
      - name: Verify APK signing certificate
        if: success()
        run: |
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls -1 "${ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::warning::未找到 apksigner，跳过 APK 证书校验"
            exit 0
          fi
          echo "使用 apksigner: $APKSIGNER"
          echo "| APK | 签名证书 SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in apk-output/*.apk; do
            INFO=$("$APKSIGNER" verify --print-certs "$f" 2>&1)
            SHA=$(printf '%s\n' "$INFO" | grep -m1 "certificate SHA-256 digest:" | sed 's/.*digest: //')
            echo "=== $(basename "$f") ==="
            echo "SHA-256: ${SHA:-未知}"
            echo "$INFO" | grep -E "Number of signers" || true
            echo "| $(basename "$f") | ${SHA:-未知} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "::notice::同一 keystore 的 APK 指纹固定；与已装应用一致且 versionCode 不降即可 adb install -r 覆盖安装。"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/songloft-build.log
          if-no-files-found: ignore

      - name: Summarize first errors (on failure)
        if: failure()
        run: |
          echo "===== 构建日志中首个错误附近内容 ====="
          grep -n -i -E "error:|what went wrong|exception|failed for task|outofmemory|gc overhead|could not|unresolved|conflicting" "$RUNNER_TEMP/songloft-build.log" | head -40 || echo "(no grep matches)"

      - name: Upload APK artifact (backup)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: songloft-leapmotor-apk
          path: |
            apk-output/*.apk
            apk-output/version.json
          retention-days: 30

      # version.json：对齐官方 build-android。设置页「检查客户端更新」的 dev 渠道靠它拿 git_commit /
      # build_time 做精确比较(frontend_version_api._fetchDevVersionInfo)，缺失会导致 dev 客户端
      # 永远显示「已是最新」。此处一并产出，避免该副作用（非启动卡死原因，但属标准产物）。
      - name: Generate version.json
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
          GIT_COMMIT: ${{ steps.build.outputs.git_commit }}
        run: |
          mkdir -p apk-output
          printf '{\n  "version": "%s",\n  "git_commit": "%s",\n  "build_time": "%s"\n}\n' \
            "$VERSION" "$GIT_COMMIT" "$BUILD_TIME" > apk-output/version.json
          echo "=== version.json 内容 ==="
          cat apk-output/version.json

      # 发布到 GitHub Releases（参照原版 build-and-release.yml 的 gh CLI 方案）。
      # 版本号跟随上游源码（TAG = pubspec version）；每次构建删除旧的同名 Release+tag 再重建，实现滚动。
      - name: Delete existing release (rolling same-version)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release (gh CLI)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
          NOTES: |
            Songloft Player (Flutter) + 零跑 2024+ 车机方控 (Leapmotor steering wheel controls, 2024–2027)

            版本: ${{ steps.version.outputs.version }}
            提交: ${{ steps.build.outputs.git_commit }}
            构建时间(UTC): ${{ steps.version.outputs.build_time }}
            Flutter: ${{ env.FLUTTER_VERSION }}

            ## 功能
            - 零跑方向盘媒体键（上一首 / 下一首 / 播放暂停）完整三层适配：
              收按键（动态注册 + 同码 400ms 去重 + 会话未就绪补发 400ms×20）
              / 占媒体源（MEDIA.INFO 声明 + 1 秒心跳 + 按键后立即重推 + 前台门）
              / 送达（标准媒体键，按下 + 抬起成对，交由 audio_service 驱动播放）
            - 协议：广播 com.leapmotor.steerwheelcontrol.media，int extra "action"（1=上一曲/4=下一曲/7=播放暂停）
            - 适用零跑 2024–2027 款（C10 及以后）

            ## 下载（按你的环境二选一）
            - **车机**（零跑 C10 / C11 / C16 等，ARM SoC）→ **songloft-leapmotor-arm64-v8a.apk**
            - **PC 模拟器**（雷电 / LDPlayer 等 **x86_64**）→ **songloft-leapmotor-x86_64.apk**
              ⚠️ 模拟器请务必装 x86_64 包。x86_64 模拟器装 arm64 包会走 ARM 二进制翻译（houdini），
              Flutter 引擎在翻译层下极易崩溃 / 卡在启动页，**测出来的现象不能代表 App 本身**。
            - 极少数老 32 位 ARM 车机（armeabi-v7a）本 Release 不提供，需单独构建。

            ## 安装
            设备开启「开发者选项 → USB 调试」后执行：
            车机（arm64）：
                adb install -r songloft-leapmotor-arm64-v8a.apk
            模拟器（x86_64）：
                adb install -r songloft-leapmotor-x86_64.apk

            ## 验证方控
                adb logcat -s Songloft-Leapmotor
            按方控「下一首」应依次看到四行（对应方控方案第 7 节）：
                方控接收器已注册（com.leapmotor.steerwheelcontrol.media）
                方控广播: action=4
                方控 → 下一曲（keyCode=87，按下+抬起成对）
                媒体源：广播声明sent=N skipped=M 自己在前台=true top=...

            ## 方控现场调试（无需重打包）
                # 查询当前模式与抢源统计
                adb shell am broadcast -a com.songloft.songloft_flutter.leapmotor24.CONFIGURE
                # 上/下一曲反了：改写映射（87=下一曲 88=上一曲 85=播放暂停）
                adb shell am broadcast -a com.songloft.songloft_flutter.leapmotor24.CONFIGURE --es map "1=88,4=87,7=85"
                # 恢复默认映射
                adb shell am broadcast -a com.songloft.songloft_flutter.leapmotor24.CONFIGURE --es map reset
                # 若与原车音乐双控/异常，先关掉媒体源声明看是否恢复
                adb shell am broadcast -a com.songloft.songloft_flutter.leapmotor24.CONFIGURE --es media_claim off

            本 Release 由 fork 的 GitHub Actions 自动构建并滚动更新，版本号跟随上游 songloft-player 源码。
        run: |
          set -euo pipefail
          ARGS=(
            "${TAG}"
            --title "Songloft 零跑方控 ${TAG}"
            --notes "${NOTES}"
            --latest
          )
          # 非 tag 触发时，将 Release 指向当前 commit（参照原版 release job 行为）
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            ARGS+=(--target "$GITHUB_SHA")
          fi
          gh release create "${ARGS[@]}" apk-output/*
          echo "::notice::已发布到 Release: $TAG -> https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
