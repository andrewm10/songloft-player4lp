name: Build Songloft APK (Leapmotor 方控)

# 在 fork 里 push 到 main，或在 Actions 页手动 Run workflow 即自动出包。
# runner 钉死 ubuntu-24.04，避免 ubuntu-latest 于 2026-10-19 起迁移到 Ubuntu 26 导致工具链突变。
#
# 重要：请确认你 Fork 的是 Flutter 客户端仓库 songloft-org/songloft-player（根目录有 pubspec.yaml）。
# 若 fork 的是父仓库 songloft-org/songloft（monorepo，clients/player 是未初始化的 git submodule），
# 仓库内没有 pubspec.yaml，本流程会直接报错并提示改用 songloft-player。
#
# 本工作流严格对齐官方 .github/workflows/build-and-release.yml 的 build-android job（Flutter 3.44.6、
# 不做 Go 后端、split-per-abi），仅在其基础上：① 拷贝方控补丁（LeapmotorMediaKeys.kt /
# SongloftApplication.kt）；② 把产物改名为 songloft-leapmotor-*.apk。
on:
  push:
    branches: [ main, master, build-apk ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # 与原版 build-and-release.yml 保持一致，使用官方验证过的稳定版本。
  FLUTTER_VERSION: '3.44.6'

jobs:
  build:
    name: Build release APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # 多插件（media_kit / inappwebview / window_manager / home_widget 等）release 打包有 OOM 风险，
    # 显式提到 4G 兜底（与官方默认行为不冲突）。若仍 OOM 可调到 -Xmx6g。
    env:
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Flutter
        run: flutter config --no-analytics

      - name: Verify Flutter project root
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            echo "::error::仓库根目录未找到 pubspec.yaml。"
            echo "::error::请确认你 Fork 的是 Flutter 客户端仓库 songloft-org/songloft-player（而不是父仓库 songloft-org/songloft）。"
            echo "::error::父仓库是 monorepo，clients/player 是未初始化的 git submodule，fork 后里面没有源码、也没有 pubspec.yaml。"
            exit 1
          fi

      - name: Apply Leapmotor 方控 patch
        run: |
          DST="android/app/src/main/kotlin/com/songloft/songloft_flutter"
          mkdir -p "$DST"
          cp "$GITHUB_WORKSPACE/patch/LeapmotorMediaKeys.kt" "$DST/"
          cp "$GITHUB_WORKSPACE/patch/SongloftApplication.kt" "$DST/"
          echo "Applied patch files:"
          ls -l "$DST"

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$PUBSPEC_VERSION"
          else
            VERSION="dev"
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      # 原生契约哈希：官方在 build 前执行，把 native_contract.json 烧进 APK（仅用于热更门控）。
      # 该文件未被 pubspec 声明为资源，缺失只影响热更门控、不影响编译；且本 fork 无内嵌 Go 后端，
      # go 哈希本就为空。脚本纯 bash（sha256sum/grep/python3，runner 均自带），此处按官方做法执行，
      # 但若脚本缺失或异常则跳过，不阻断构建。
      - name: Compute native contract hash (bake asset, optional)
        continue-on-error: true
        run: |
          if [ -f scripts/compute_native_contract.sh ]; then
            HASHES=$(./scripts/compute_native_contract.sh \
              --write-asset android/app/src/main/assets/native_contract.json)
            echo "native_contract.json = $HASHES"
          else
            echo "compute_native_contract.sh 不存在，跳过（不影响编译）"
          fi

      - name: Build release APK (split-per-abi)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "GIT_COMMIT=$GIT_COMMIT"
          flutter build apk --release --split-per-abi \
            --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} \
            --dart-define=FRONTEND_GIT_COMMIT=$GIT_COMMIT \
            --dart-define=FLUTTER_BINDING=${{ env.FLUTTER_VERSION }} \
            --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} \
            --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} \
            --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }} \
            2>&1 | tee "$RUNNER_TEMP/songloft-build.log"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: ${{ runner.temp }}/songloft-build.log
          if-no-files-found: warn

      - name: Summarize first errors (on failure)
        if: failure()
        run: |
          echo "===== 构建日志中首个错误附近内容 ====="
          grep -n -i -E "error:|what went wrong|exception|failed for task|outofmemory|gc overhead|could not|unresolved|conflicting" "$RUNNER_TEMP/songloft-build.log" | head -40 || echo "(no grep matches)"

      - name: Collect APK
        if: success()
        run: |
          mkdir -p apk-output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk-output/songloft-leapmotor-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk-output/songloft-leapmotor-armeabi-v7a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk apk-output/songloft-leapmotor-x86_64.apk 2>/dev/null || true
          echo "=== APK 产物 ==="
          ls -lh apk-output/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: songloft-leapmotor-apk
          path: apk-output/*.apk
          retention-days: 7
